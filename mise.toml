[tasks.build]
run = "npm run build"
description = "Compile TypeScript to dist/"

[tasks.start]
run = "npm run start"
description = "Start the MCP server (run build first)"

[tasks.dev]
run = "npm run dev"
description = "Start the MCP server in development mode with file watching"

[tasks.query]
run = "npm run query --"
description = "Run the query CLI tool"

[tools]
node = "20"
